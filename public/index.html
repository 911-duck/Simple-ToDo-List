<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/4f04e3c352.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <div class="container">
        <h1 class="container__header">Simple ToDo List</h1>
        <div class="container__functions functions">
            <input placeholder="header" class="functions__header-input"></input>
            <input placeholder="discription" class="functions__discription-input"></input>
            <button class="functions__add add"><i class="fa-solid fa-plus"></i></button>
        </div>
        <div class="container__list list">
            <div class="list__item item">
                <input type="checkbox" class="item__checkbox">
                <div class="item__txt txt">
                    <span class="txt__header">test</span>
                    <span class="txt__discription">Lorem ipsum dolor sit amet consectetur adipisicing elit. Tempora aspernatur tenetur,</span>
                </div>
                <button class="item__delete delete"><i class="fa-regular fa-trash-can"></i></button>
            </div>
        </div>
    </div>

</body>
</html>
