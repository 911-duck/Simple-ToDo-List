<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/4f04e3c352.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <div class="container">
        <h1 class="container__header">Simple ToDo List</h1>
        <div class="container__functions functions">
            <input placeholder="header" class="functions__header-input"></input>
            <input placeholder="discription" class="functions__discription-input"></input>
            <select class="functions__select" title="приоритет">
                <option value="" disabled selected>приоритет</option>
                <option value="высокий">высокий</option>
                <option value="средний">средний</option>
                <option value="низкий">низкий</option>
            </select>
            <button class="functions__add add"><i class="fa-solid fa-plus"></i></button>
        </div>
        <div class="container__list list">
        </div>
    </div>
    <script src="./script/main.js" type="module"></script>
</body>
</html>
